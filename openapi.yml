          description: User deleted

  /users/{user_id}/chats:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
        description: User ID
    get:
      summary: Get user chats
      operationId: user.chats
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/pageParam'
        - name: order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: read
          in: query
          description: Filter read/unread chats
          required: false
          schema:
            type: boolean
        - name: type
          in: query
          description: Filter by chat type
          required: false
          schema:
            type: string
            enum: [private, group, supergroup, channel]
        - name: metadata
          in: query
          description: Filter by metadata
          required: false
          style: deepObject
          schema:
            type: object
            additionalProperties:
              type: string
        - name: with_last_message
          in: query
          description: >-
            Embed each chat's latest message as `last_message`
            (a MessageResource object). 1 = yes, 0 = no — backend wants the
            integer wire value; Laravel's `boolean` rule on `ChatsRequest`
            rejects the string `true`/`false`.
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - name: with_participants
          in: query
          description: >-
            Embed each chat's participants as `participants` (a ParticipantResource
            array). 1 = yes, 0 = no — same integer wire value as
            `with_last_message`. Honored only for `private` chats and `group`
            chats up to the tenant's threshold (default 100 members); larger
            groups require the `api_settings.participants_listing.list_large_groups`
            tenant override. When participants are withheld the chat instead
            carries `participants_omitted` explaining why. `supergroup` and
            `channel` chats never embed participants.
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
        - $ref: '#/components/parameters/withOwnerParam'
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - chats
                  - meta
                  - pagination
                properties:
                  chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatResource'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /users/{user_id}/fcm_tokens:
