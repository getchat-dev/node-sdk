                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Firebase FCM VAPID updated

  /settings/push-notifications:
    put:
      summary: Set push notification settings
      operationId: tenant.setPushNotificationsSettings
      tags:
        - Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                icon:
                  type: string
                  format: uri
                  maxLength: 100
                url_template:
                  type: string
                  maxLength: 255
                disabled:
                  type: boolean
      responses:
        '200':
          description: Push notification settings updated

  /settings/participants:
    put:
      summary: Set participant-listing settings
      operationId: tenant.setParticipantsListingSettings
      tags:
        - Settings
      description: >-
        Controls whether large `group` chats expose their participants inline
        via `with_participants` on GET /users/{user_id}/chats (and other
        ChatResource endpoints). Stored under
        `api_settings.participants_listing`. At least one field is required;
        fields are updated independently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                list_large_groups:
                  type: boolean
                  description: >-
                    When true, groups larger than `group_threshold` also embed
                    their participants. `supergroup`/`channel` are unaffected.
                group_threshold:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: >-
                    Group size up to which participants are always embedded.
                    Defaults to 100 when unset.
      responses:
        '200':
          description: Participant-listing settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean

  /clear:
    put:
      summary: Clear tenant data
      operationId: tenant.clearData
      tags:
        - Tenant
      parameters:
        - $ref: '#/components/parameters/syncParam'
      responses:
        '200':
          description: >-
            Data cleared synchronously. Returned only when `sync=true` — the job
            runs inline and completes before the response (no `job_id`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
        '202':
          description: >-
            Clear-data job dispatched asynchronously. This is the default when
            `sync` is not set; the job runs in the background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  job_id:
                    type: string
        '405':
          description: >-
            Data clearing is disabled for this tenant
            (`api_settings.allow_clear_data` is off).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string

components:
  schemas:
    ParticipantRights:
      type: object
      description: >-
        Per-chat right overrides. Each key optional; booleans accept
        `true`/`false`/`null`. Mirrors the signed-link rights schema.
        A repeated participant id (or one equal to the chat owner) keeps
        only its first occurrence.
      properties:
        send_messages: { type: boolean, nullable: true }
        can_press_buttons: { type: boolean, nullable: true }
        edit_messages: { type: string, nullable: true, enum: [none, my, any] }
        delete_messages: { type: string, nullable: true, enum: [none, my, any] }
        pin_messages: { type: string, nullable: true, enum: [none, for_me, for_everyone] }
        send_typing: { type: boolean, nullable: true }
        send_photos: { type: boolean, nullable: true }
        send_voices: { type: boolean, nullable: true }
        send_audio: { type: boolean, nullable: true }
        send_documents: { type: boolean, nullable: true }
        send_location: { type: boolean, nullable: true }
        create_pool: { type: boolean, nullable: true }
        participate_pool: { type: boolean, nullable: true }
        kick_users: { type: boolean, nullable: true }
        track_presence: { type: boolean, nullable: true }
        track_read_state: { type: boolean, nullable: true }
        send_read_state: { type: boolean, nullable: true }
        react_messages: { type: boolean, nullable: true }
        leave_chats: { type: boolean, nullable: true }

    OwnerInput:
      type: object
      description: >-
        Chat owner payload. Validation itself marks every field optional, but
        POST /chats rejects a chat without owner data (422 "Chat owner is
        required"). Omitting `id` creates a fresh detached user record on
        every call — always pass `id`. The owner is also added as the chat's
        first participant and may carry per-chat `rights`.
      properties:
        id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        link:
          type: string
          format: uri
        picture:
          type: string
          format: uri
        metadata:
          type: object
          maxProperties: 100
          description: >-
            Scalar values (null allowed); nested objects are flattened into
            dot-notation keys. NOTE: currently ignored by the user upsert —
            not persisted.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
        rights:
          $ref: '#/components/schemas/ParticipantRights'

    ParticipantInput:
      description: |
        Participant payload for chat creation / addParticipants / sendMessage.
        Distinct from `User` because participants carry an optional `is_bot` flag
        that the bare User entity doesn't model.
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: External user id (no length limit is enforced).
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 100
        link:
          type: string
          format: uri
        picture:
          type: string
          description: Plain string — not validated as a URL here.
        is_bot:
          type: boolean
          description: >-
            Accepted but currently NOT persisted — the user upsert only reads
            a camelCase `isBot` field, which this API never produces.
        rights:
          $ref: '#/components/schemas/ParticipantRights'

    Button:
      description: Inline action button attached to a message.
      type: object
      required:
        - type
        - label
      properties:
        action:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [url, call, local, remote]
        label:
          type: string
          maxLength: 100
        state:
          type: string
          enum: [default, loading, disabled]
        style:
          type: string
          enum: [primary, positive, negative, neutral]

    Avatar:
      description: |
        User avatar — either a URL string when an image is set, or an object
        describing an auto-generated placeholder (initials on a colored bg).
      oneOf:
        - type: string
          format: uri
        - type: object
          required:
            - kind
          properties:
            kind:
              type: string
              description: Auto-generated avatar kind (e.g. "auto")
            color:
              type: string
              description: Display color for the placeholder
            initials:
              type: string
              description: Initials shown on the placeholder

    User:
      type: object
      required:
        - id
        - name
      description: >-
        On POST /chats/{chat_id}/messages `name` is required only when the
        user doesn't exist yet (or exists without a name).
      properties:
        id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        link:
          type: string
          format: uri
        picture:
          type: string
          format: uri
        metadata:
          type: object
          maxProperties: 100
          description: >-
            Scalar values; nested objects are flattened into dot-notation
            keys. NOTE: on chat-scoped endpoints (send message, chat create)
            the user upsert currently ignores metadata.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    UserResource:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        link:
          type: string
          format: uri
        picture:
          $ref: '#/components/schemas/Avatar'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string

    ParticipantResource:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        link:
          type: string
          format: uri
        picture:
          $ref: '#/components/schemas/Avatar'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatResource:
      type: object
      required:
        - id
        - type
        - title
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: External chat ID
        type:
          type: string
          nullable: true
          description: >-
            Chat type; null for legacy chats created without one.
          enum: [private, group, supergroup, channel]
        title:
          type: string
          nullable: true
          description: Chat title
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          description: Present only when the chat has messages.
        last_message:
          description: >-
            The chat's most recent message. Present only when requested via
            `with_last_message` (GET /chats, GET /chats/{chat_id},
            GET /users/{user_id}/chats).
          allOf:
            - $ref: '#/components/schemas/MessageResource'
        owner_id:
          type: string
          description: External owner ID; present only when the chat has one.
        owner:
          description: Present only with `with_owner` (see the parameter).
          allOf:
            - $ref: '#/components/schemas/UserResource'
        participants:
          type: array
          description: >-
            The chat's participants. Present only when requested via
            `with_participants` and the chat is eligible (see the parameter).
          items:
            $ref: '#/components/schemas/ParticipantResource'
        participants_omitted:
          type: object
          description: >-
            Present instead of `participants` when `with_participants` was
            requested but participants were withheld for this chat.
          required:
            - reason
            - members_count
          properties:
            reason:
              type: string
              enum: [large_group, unsupported_type]
              description: >-
                `large_group` — a group above the tenant threshold with the
                override off (see `hint`); `unsupported_type` — a supergroup or
                channel, which never embeds participants.
            members_count:
              type: integer
            hint:
              type: string
              description: >-
                How to lift the omission. Present only for `large_group`, where
                enabling the tenant override would include participants.
        metadata:
          type: object
          description: Present only when non-empty. Values are scalars.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean

    MessageResource:
      type: object
      required:
        - id
        - seq
        - user_id
        - text
        - created_at
        - updated_at
        - is_deleted
        - is_edited
        - versions
        - extra
      properties:
        id:
          type: string
        seq:
          type: integer
          description: Monotonic per-chat sequence number (the sort key).
        user_id:
          type: string
          description: >-
            The sender's EXTERNAL id when known; the internal id for legacy
            messages without one.
        text:
          type: string
          nullable: true
          description: Null for deleted messages.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds).
        updated_at:
          type: integer
          format: int64
          nullable: true
          description: Unix timestamp (seconds); null until the first update.
        is_deleted:
          type: boolean
        is_edited:
          type: boolean
        versions:
          type: integer
          description: Number of stored previous versions
        extra:
          type: object
          description: >-
            NOTE: serialized as an empty JSON array `[]` (not `{}`) when
            there are no extra fields.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
        recipient_id:
          type: string
          description: External recipient id; present only when set.
        buttons:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Button'

    PaginationMeta:
      type: object
      description: Row counts behind a list response.
      required:
        - total
        - output
      properties:
        total:
          type: integer
          description: Rows the query matched across all pages.
        output:
          type: integer
          description: Rows this page carries.

    Pagination:
      type: object
      description: Page state of a list response.
      required:
        - items_per_page
        - current
        - total
      properties:
        items_per_page:
          type: integer
          description: Effective page size — the requested `limit` after clamping.
        current:
          type: integer
          description: >-
            Requested page clamped to the page count; 0 when nothing matched.
        total:
          type: integer
          description: Number of pages; 0 when nothing matched.
        next_page_url:
          type: string
          nullable: true
          description: Null on the last page.
        prev_page_url:
          type: string
          nullable: true
          description: Null on the first page.

    StatusError:
      type: object
      description: >-
        Controller-level failure — `status: false` plus a `message`.
      properties:
        status:
          type: boolean
          example: false
        message:
          type: string

    ValidationError:
      type: object
      description: Standard Laravel validation error body (HTTP 422).
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    NotFound:
      description: >-
        A URL-bound resource (chat / user / message) was not found. Standard
        Laravel 404 body.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

  headers:
    PreferenceApplied:
      description: >-
        Present (as `return=representation`) when the client requested the
        entity via `Prefer: return=representation` (or the deprecated
        `?result=yes` flag) and the server honored it. Per RFC 7240.
      required: false
      schema:
        type: string
        enum: [return=representation]

  parameters:
    chatIdParam:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
      description: Chat ID

    withOwnerParam:
      name: with_owner
      in: query
      required: false
      description: >-
        Embed the chat owner as `owner` (a UserResource) inside each returned
        chat. Truthy values: `1`, `true`, `on`, `yes` (unvalidated — anything
        else counts as no). On GET /chats it is force-disabled when the
        `owner` filter is used. On POST /chats and PUT /chats/{chat_id} it
        applies only when the chat is echoed back
        (`Prefer: return=representation`).
      schema:
        type: string
        example: '1'

    withLastMessageParam:
      name: with_last_message
      in: query
      required: false
      description: >-
        Embed each chat's latest message as `last_message` (a
        MessageResource). Truthy values: `1`, `true`, `on`, `yes`
        (unvalidated here; on GET /users/{user_id}/chats this parameter is
        validated as a Laravel boolean instead — see that endpoint).
      schema:
        type: string
        example: '1'

    syncParam:
      name: sync
      in: query
      required: false
      schema:
        type: boolean
      description: force sync execution of method

    preferReturnParam:
      name: Prefer
      in: header
      required: false
      description: >-
        RFC 7240 preference for echoing the affected entity in the response.
        `return=representation` includes it; `return=minimal` (default) returns
        only `status`. When honored, the response adds a
        `Preference-Applied: return=representation` header.
      schema:
        type: string
        enum: [return=representation, return=minimal]

    withParticipantsParam:
      name: with_participants
      in: query
      required: false
      description: >-
        Also include the created `participants`. Only with
        `Prefer: return=representation`.
      schema:
        type: boolean
        default: false

    resultParam:
      name: result
      in: query
      required: false
      deprecated: true
      description: >-
        DEPRECATED — use `Prefer: return=representation` instead. Legacy flag:
        `yes` includes the affected entity in the response. Still honored;
        usage is logged server-side.
      schema:
        type: string
        enum: [yes, no]
        default: no

    participantsResultParam:
      name: participants
      in: query
      required: false
      deprecated: true
      description: >-
        DEPRECATED — use `with_participants` instead. Legacy flag: `yes` (with
        `result=yes`) includes the created participants. Still honored; usage
        is logged server-side.
      schema:
        type: string
        enum: [yes, no]
        default: no

    limitParam:
      name: limit
      in: query
      required: false
      description: >-
        Items per page (default 50). Must be an integer >= 1 — `0` and negative
        values are rejected with 422. Values above the endpoint's ceiling are
        silently clamped, not rejected; the ceiling is 1000 everywhere except
        GET /users/{user_id}/chats, where it is 250.
      schema:
        type: integer
        minimum: 1
        default: 50

    pageParam:
      name: page
      in: query
      required: false
      description: >-
        Page number (default 1). Must be an integer >= 1; a page past the last
        one is clamped to the last page.
      schema:
        type: integer
        minimum: 1
        default: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque tenant token (`Client.api_token`) — not a JWT. Must be sent in
        the `Authorization: Bearer` header: tenant resolution compares
        exactly this header, so query-string token variants do not work.
        Missing or wrong token yields 401 (auth guard) or 403 (tenant
        resolution).

security:
  - bearerAuth: []

tags:
  - name: Chats
    description: Chat management
  - name: Chat Participants
    description: Chat participants management
  - name: Chat Messages
    description: Chat messages management
  - name: Chat Webhooks
    description: Chat webhook configuration
  - name: Chat S3
    description: Chat S3 storage configuration
  - name: Users
    description: User management
  - name: Tenant
    description: Tenant configuration
  - name: Firebase
    description: Firebase configuration
  - name: Settings
    description: General settings