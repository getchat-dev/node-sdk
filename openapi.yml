                    $ref: '#/components/schemas/UserResource'

    put:
      summary: Update user
      operationId: user.update
      tags:
        - Users
      parameters:
        - $ref: '#/components/parameters/preferReturnParam'
        - $ref: '#/components/parameters/resultParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id:
                      type: string
                      maxLength: 255
                    name:
                      type: string
                      maxLength: 255
                    email:
                      type: string
                      format: email
                    link:
                      type: string
                      format: uri
                    picture:
                      type: string
                      format: uri
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
      responses:
        '200':
          description: >-
            User updated. `user` is returned only with
            `Prefer: return=representation`.
          headers:
            Preference-Applied:
              $ref: '#/components/headers/PreferenceApplied'
          content:
            application/json:
              schema:
